spring:
  application:
    name: enterpriseos-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/enterpriseos?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:enterpriseos}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-init-sql: SET time_zone = '+00:00'
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${PORT:8080}
  error:
    include-message: never
  forward-headers-strategy: none
app:
  setup-enabled: ${APP_SETUP_ENABLED:false}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5173}
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:8080,http://localhost:3000}
  secure-cookies: ${APP_SECURE_COOKIES:false}
  session-hours: ${APP_SESSION_HOURS:8}
  mail-from: ${APP_MAIL_FROM:enterpriseos@localhost}
  mail-outbox-dir: ${APP_MAIL_OUTBOX_DIR:./var/mail-outbox}
  logo-dir: ${APP_LOGO_DIR:./var/logos}
