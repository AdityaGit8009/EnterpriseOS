name: Verify EnterpriseOS
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-only-password
          MYSQL_DATABASE: enterpriseos_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pintegration-only-password" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: npm install --no-audit --no-fund
        working-directory: apps/web
      - run: npm run typecheck && npm test && npm run build
        working-directory: apps/web
      - run: mvn -B verify
        working-directory: services/api
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/enterpriseos_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
          TEST_DB_USERNAME: root
          TEST_DB_PASSWORD: integration-only-password
      - run: npm audit --omit=dev --audit-level=high
        working-directory: apps/web
      - run: python scripts/merge-openapi.py && python scripts/check-api-routes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            services/api/target/surefire-reports
            apps/web/dist
